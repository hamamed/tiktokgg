<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Gift Runner</title>
  <meta name="description" content="Three-lane runner driven by TikTok LIVE gifts. Add as an OBS Browser Source (1080×1920)." />
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style>
    :root { --red: #fe2c55; --cyan: #25f4ee; --text: #f1f5f9; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    #frame { position: relative; height: 100vh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #mud { pointer-events: none; }
    svg.i { width: 1em; height: 1em; flex: none; }

    /* HUD */
    .hud { position: absolute; left: 3.5%; right: 3.5%; top: 2.5%; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; font-size: clamp(11px, 2.3vh, 22px); }
    .panel { background: rgba(8, 10, 20, .72); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: .55em .8em; backdrop-filter: blur(6px); }
    .score { font-weight: 800; font-size: 1.5em; display: flex; align-items: center; gap: .35em; font-variant-numeric: tabular-nums; }
    .sub { color: var(--muted); font-size: .7em; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .hp { width: 9em; }
    .hpbar { height: .6em; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: .35em; }
    .hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #a3e635); transition: width .25s, background .25s; }
    .effects { position: absolute; left: 3.5%; right: 3.5%; top: 12%; display: flex; flex-wrap: wrap; gap: .4em; pointer-events: none; font-size: clamp(10px, 2vh, 19px); }
    .fx { display: flex; align-items: center; gap: .45em; padding: .35em .7em; border-radius: 99px; font-weight: 700; background: rgba(8,10,20,.75); border: 1px solid rgba(255,255,255,.1); }
    .fx b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }

    /* gift alerts */
    .alerts { position: absolute; right: 3.5%; top: 23%; width: 70%; display: flex; flex-direction: column; gap: .5em; align-items: flex-end; pointer-events: none; font-size: clamp(10px, 2.1vh, 20px); }
    .alert { display: flex; align-items: center; gap: .6em; padding: .55em .8em; border-radius: 14px; background: rgba(8,10,20,.82); border: 1px solid rgba(255,255,255,.1); border-left: 4px solid var(--red); max-width: 100%; animation: pop .25s ease-out; }
    .alert.out { animation: fade .4s ease-in forwards; }
    .alert .ic { display: grid; place-items: center; width: 2.1em; height: 2.1em; border-radius: 10px; background: rgba(255,255,255,.06); font-size: 1.1em; flex: none; }
    .alert .who { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .alert .what { color: var(--muted); font-size: .8em; display: flex; align-items: center; gap: .3em; white-space: nowrap; }
    @keyframes pop { from { opacity: 0; transform: translateX(20px) scale(.96); } }
    @keyframes fade { to { opacity: 0; transform: translateX(20px); } }

    /* banners */
    .banner { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font-size: clamp(14px, 3vh, 30px); }
    .banner h2 { margin: 0; font-size: 2.2em; font-weight: 900; letter-spacing: .02em; text-shadow: 0 4px 30px rgba(0,0,0,.8); }
    .banner p { margin: .3em 0 0; color: var(--muted); font-weight: 600; }
    .flashbanner { animation: pulse .9s ease-out; }
    @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(.6); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

    .conn { position: absolute; left: 3.5%; bottom: 1.8%; display: flex; align-items: center; gap: .4em; font-size: clamp(9px, 1.5vh, 14px); color: var(--muted); pointer-events: none; }
    .dot { width: .6em; height: .6em; border-radius: 50%; background: #ef4444; }
    .dot.on { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .tools { position: absolute; right: 3.5%; bottom: 1.5%; display: flex; gap: .4em; font-size: clamp(10px, 1.7vh, 16px); }
    .tools button { display: inline-flex; align-items: center; gap: .35em; background: rgba(8,10,20,.7); color: var(--text); border: 1px solid rgba(255,255,255,.12); border-radius: 99px; padding: .35em .8em; font: inherit; font-weight: 600; cursor: pointer; }
    .tools button:hover { background: rgba(255,255,255,.12); }
    body.obs .tools, body.preview .tools { display: none; }
  </style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" width="540" height="960"></canvas>
    <canvas id="mud" width="540" height="960"></canvas>

    <div class="hud">
      <div class="panel">
        <div class="sub">Distance</div>
        <div class="score"><span data-icon="route"></span><span id="score">0</span></div>
      </div>
      <div class="panel hp">
        <div class="sub" style="display:flex;justify-content:space-between"><span>HP</span><span id="hptext">100</span></div>
        <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
        <div class="sub" style="margin-top:.35em">Best <span id="best">0</span></div>
      </div>
    </div>
    <div class="effects" id="effects"></div>
    <div class="alerts" id="alerts"></div>
    <div class="banner" id="banner"></div>

    <div class="conn"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
    <div class="tools">
      <button id="autoBtn" type="button"><span data-icon="bot"></span><span>Autopilot on</span></button>
    </div>
  </div>
</div>

<script>
/* ===========================================================================
 * Gift Runner: listens for GAME_EVENT frames from server.js and reacts to:
 *   SPAWN_OBSTACLE · SPEED_BOOST · SPEED_SLOW · SCREEN_SPLATTER · REVERSE_CONTROLS · BOSS_ATTACK · HEAL_PLAYER
 *
 * URL options:  ?token=XYZ        access token (also read from the dashboard's saved token)
 *               ?server=wss://…   control server (default: same host /ws, or ws://localhost:8080 locally)
 *               ?obs=1            hide on-screen buttons      ?preview=1  dashboard preview mode
 * ======================================================================== */

// ---------- icons (Lucide) ----------
const pascal = (s) => s.replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());
function icon(name, cls = 'i') {
  const node = window.lucide?.icons?.[pascal(name)];
  const kids = !node ? [] : Array.isArray(node[0]) ? node : node[2] ?? [];
  return `<svg class="${cls}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${kids
    .map(([t, a]) => `<${t} ${Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`).join('')}</svg>`;
}
document.querySelectorAll('[data-icon]').forEach((el) => (el.innerHTML = icon(el.dataset.icon)));

const ACTION_LOOK = {
  SPAWN_OBSTACLE:   { icon: 'construction',     color: '#fdba74', label: 'Barriers' },
  SPEED_BOOST:      { icon: 'zap',              color: '#fcd34d', label: 'Speed boost' },
  SPEED_SLOW:       { icon: 'snail',            color: '#7dd3fc', label: 'Slow motion' },
  SCREEN_SPLATTER:  { icon: 'droplets',         color: '#a16207', label: 'Mud splatter' },
  REVERSE_CONTROLS: { icon: 'arrow-left-right', color: '#c4b5fd', label: 'Reversed controls' },
  BOSS_ATTACK:      { icon: 'skull',            color: '#f87171', label: 'Boss attack' },
  HEAL_PLAYER:      { icon: 'heart-pulse',      color: '#6ee7b7', label: 'Heal' },
};
const GIFT_ICON = { rose: 'flower', 'ice cream cone': 'ice-cream-cone', 'finger heart': 'hand-heart', doughnut: 'donut', galaxy: 'sparkles', universe: 'orbit' };

// ---------- options ----------
const qs = new URLSearchParams(location.search);
const readStore = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const hosted = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const SERVER = qs.get('server') || readStore('tt.server') || (hosted ? `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws` : 'ws://localhost:8080');
const TOKEN = qs.get('token') || readStore('tt.token') || '';
// Gift images are served by the control server (/gift-img/<id>.png); turn ws(s)://host/ws into http(s)://host.
const HTTP_BASE = SERVER.replace(/^ws(s?):/, 'http$1:').replace(/\/ws\/?$/, '').replace(/\/$/, '');
const imgSrc = (u) => (!u ? '' : u.startsWith('/') ? HTTP_BASE + u : u);
if (qs.get('obs') === '1') document.body.classList.add('obs');
if (qs.get('preview') === '1') document.body.classList.add('preview');

// ---------- canvas & world ----------
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const mudCvs = document.getElementById('mud');
const mctx = mudCvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const LANES = 3, ROAD_X = 60, ROAD_W = W - 120, LANE_W = ROAD_W / LANES;
const laneX = (l) => ROAD_X + LANE_W * l + LANE_W / 2;
const PLAYER_Y = H - 190, CAR_W = 70, CAR_H = 120;
const BASE_SPEED = 420; // px / s
const BOSS_Y = 330;     // boss hovers below the HUD and alerts
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

const S = {
  lane: 1, x: laneX(1), hp: 100, dist: 0, best: Number(readStore('gr.best')) || 0,
  invuln: 0, crashed: 0, lastHitBy: null, autopilot: true, aiCooldown: 0,
  obstacles: [], shots: [], particles: [], mud: [], stripes: 0,
  fx: { boost: { until: 0, mul: 1 }, slow: { until: 0, mul: 1 }, reverse: { until: 0 }, mud: { until: 0 } },
  boss: null, // { until, level, x, dir, fireIn }
  ambientIn: 1.2, shake: 0, now: 0,
};

function speedMul() {
  let m = 1;
  if (S.fx.boost.until > S.now) m *= S.fx.boost.mul;
  if (S.fx.slow.until > S.now) m *= S.fx.slow.mul;
  return m;
}

// ---------- gift actions ----------
// The server sends value = rule value × combo count, plus repeatCount, so unit = value / repeatCount.
const ACTIONS = {
  SPAWN_OBSTACLE(ev) {
    const n = clamp(Math.round(ev.value) || 1, 1, 40);
    for (let i = 0; i < n; i++) spawnObstacle(-120 - i * 170, ev.user);
  },
  SPEED_BOOST(ev) {
    const unit = ev.value / Math.max(1, ev.repeatCount || 1);
    S.fx.boost.mul = clamp(unit || 1.5, 1.2, 2.5);
    S.fx.boost.until = Math.max(S.fx.boost.until, S.now) + 4 + 1.5 * ((ev.repeatCount || 1) - 1);
  },
  SPEED_SLOW(ev) {
    const unit = ev.value / Math.max(1, ev.repeatCount || 1);
    S.fx.slow.mul = clamp(unit || 0.5, 0.3, 0.9);
    S.fx.slow.until = Math.max(S.fx.slow.until, S.now) + 4 + 1.5 * ((ev.repeatCount || 1) - 1);
  },
  SCREEN_SPLATTER(ev) {
    const secs = clamp(ev.value || 3, 1, 20);
    S.fx.mud.until = Math.max(S.fx.mud.until, S.now) + secs;
    const blobs = clamp(5 + Math.round(secs * 1.5), 6, 24);
    for (let i = 0; i < blobs; i++) S.mud.push({ x: rand(30, W - 30), y: rand(120, H - 120), r: rand(40, 110), seed: Math.random() * 1000 });
  },
  REVERSE_CONTROLS(ev) {
    S.fx.reverse.until = Math.max(S.fx.reverse.until, S.now) + clamp(ev.value || 5, 1, 30);
  },
  BOSS_ATTACK(ev) {
    const unit = ev.value / Math.max(1, ev.repeatCount || 1);
    const level = clamp(Math.round(unit) || 1, 1, 5);
    const extra = 6 + 2 * level + 3 * ((ev.repeatCount || 1) - 1);
    if (S.boss && S.boss.until > S.now) { S.boss.level = Math.max(S.boss.level, level); S.boss.until += extra; S.boss.by = ev.user; }
    else S.boss = { until: S.now + extra, level, x: W / 2, dir: 1, fireIn: 1.2, enter: 0, by: ev.user };
    banner('BOSS INCOMING', `level ${level} · sent by @${ev.user}`, '#f87171');
  },
  HEAL_PLAYER(ev) {
    if (S.crashed > 0) return;
    S.hp = clamp(S.hp + (Number(ev.value) || 10), 0, 100);
    for (let i = 0; i < 24; i++) S.particles.push({ x: S.x + rand(-30, 30), y: PLAYER_Y + rand(0, CAR_H), vx: rand(-40, 40), vy: rand(-160, -60), life: 1, color: '#6ee7b7' });
  },
};

function handleGameEvent(ev) {
  const fn = ACTIONS[ev.action];
  showAlert(ev, !!fn);
  if (fn) fn(ev);
}

// ---------- world helpers ----------
function spawnObstacle(y = -120, by = null) {
  // Never block all three lanes in the same row: pick a lane, avoid stacking right on top of another.
  const lane = (Math.random() * LANES) | 0;
  const kind = Math.random() < 0.25 ? 'cone' : 'barrier';
  S.obstacles.push({ lane, y, h: kind === 'cone' ? 60 : 46, kind, by });
}

function hurt(dmg, by) {
  if (S.invuln > 0 || S.crashed > 0) return;
  S.hp = clamp(S.hp - dmg, 0, 100);
  S.invuln = 0.9;
  S.shake = 0.35;
  S.lastHitBy = by || S.lastHitBy;
  for (let i = 0; i < 18; i++) S.particles.push({ x: S.x + rand(-25, 25), y: PLAYER_Y + rand(0, 40), vx: rand(-220, 220), vy: rand(-220, 40), life: 0.8, color: '#fe2c55' });
  if (S.hp <= 0) {
    S.crashed = 3;
    S.best = Math.max(S.best, Math.floor(S.dist));
    try { localStorage.setItem('gr.best', JSON.stringify(S.best)); } catch {}
    banner('CRASHED', S.lastHitBy ? `taken out by @${S.lastHitBy}` : 'back in 3…', '#fe2c55');
  }
}

function steer(dir) {
  if (S.crashed > 0) return;
  if (S.fx.reverse.until > S.now) dir = -dir; // the gift effect
  S.lane = clamp(S.lane + dir, 0, LANES - 1);
}

// Autopilot: look ahead and move to the safest lane. Reversed controls confuse it (on purpose).
function autopilot(dt) {
  S.aiCooldown -= dt;
  if (S.aiCooldown > 0) return;
  const danger = [0, 0, 0];
  for (const o of S.obstacles) {
    const dy = PLAYER_Y - (o.y + o.h);
    if (dy > -CAR_H && dy < 420) danger[o.lane] += 1 + (420 - dy) / 200;
  }
  for (const s of S.shots) {
    const dy = PLAYER_Y - s.y;
    if (dy > -40 && dy < 300) danger[clamp(Math.floor((s.x - ROAD_X) / LANE_W), 0, 2)] += 1.5;
  }
  const cur = S.lane;
  if (danger[cur] < 0.5) return;
  const options = [cur - 1, cur + 1].filter((l) => l >= 0 && l < LANES).sort((a, b) => danger[a] - danger[b]);
  if (options.length && danger[options[0]] < danger[cur]) {
    steer(options[0] > cur ? 1 : -1);
    S.aiCooldown = 0.22;
  }
}

// ---------- loop ----------
let last = performance.now();
function tick(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  S.now += dt;
  update(dt);
  draw();
  requestAnimationFrame(tick);
}

function update(dt) {
  const v = BASE_SPEED * speedMul() * (S.crashed > 0 ? 0.25 : 1);
  S.stripes = (S.stripes + v * dt) % 80;
  S.x += (laneX(S.lane) - S.x) * Math.min(1, dt * 14);
  S.invuln = Math.max(0, S.invuln - dt);
  S.shake = Math.max(0, S.shake - dt);

  if (S.crashed > 0) {
    S.crashed -= dt;
    if (S.crashed <= 0) { S.hp = 100; S.dist = 0; S.obstacles = []; S.shots = []; S.lastHitBy = null; S.invuln = 1.5; banner('', ''); }
  } else {
    S.dist += v * dt / 40;
    if (S.autopilot) autopilot(dt);
  }

  // ambient traffic so the game is alive between gifts
  S.ambientIn -= dt * speedMul();
  if (S.ambientIn <= 0) { spawnObstacle(); S.ambientIn = rand(1.1, 2.0); }

  for (const o of S.obstacles) {
    o.y += v * dt;
    const hitX = Math.abs(laneX(o.lane) - S.x) < (LANE_W * 0.55);
    if (!o.hit && hitX && o.y + o.h > PLAYER_Y + 10 && o.y < PLAYER_Y + CAR_H - 10) { o.hit = true; hurt(20, o.by); }
  }
  S.obstacles = S.obstacles.filter((o) => o.y < H + 80 && !o.hit);

  // boss
  const b = S.boss;
  if (b) {
    b.enter = Math.min(1, b.enter + dt * 1.5);
    b.x += b.dir * (90 + 25 * b.level) * dt;
    if (b.x < ROAD_X + 60 || b.x > ROAD_X + ROAD_W - 60) b.dir *= -1;
    b.fireIn -= dt;
    if (b.fireIn <= 0 && S.crashed <= 0 && b.until > S.now) {
      const aim = Math.atan2(PLAYER_Y + 40 - (BOSS_Y + 30), S.x - b.x);
      const spread = b.level >= 3 ? [-0.18, 0, 0.18] : [0];
      for (const s of spread) S.shots.push({ x: b.x, y: BOSS_Y + 30, vx: Math.cos(aim + s) * 360, vy: Math.sin(aim + s) * 360, by: b.by });
      b.fireIn = Math.max(0.35, 1.4 - b.level * 0.2);
    }
    if (b.until <= S.now) { b.enter -= dt * 3; if (b.enter <= 0) S.boss = null; }
  }
  for (const s of S.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (!s.hit && Math.abs(s.x - S.x) < CAR_W / 2 + 8 && s.y > PLAYER_Y && s.y < PLAYER_Y + CAR_H) { s.hit = true; hurt(10, s.by); }
  }
  S.shots = S.shots.filter((s) => !s.hit && s.y < H + 20 && s.x > -20 && s.x < W + 20);

  for (const p of S.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
  S.particles = S.particles.filter((p) => p.life > 0);

  if (S.fx.mud.until <= S.now) S.mud = [];
  renderHud();
}

// ---------- drawing ----------
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-8, 8) * S.shake * 3, rand(-8, 8) * S.shake * 3);

  // sky + roadside
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1026'); g.addColorStop(1, '#05060d');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#0d1224'; ctx.fillRect(ROAD_X, -20, ROAD_W, H + 40);
  // neon road edges
  ctx.shadowColor = '#25f4ee'; ctx.shadowBlur = 18; ctx.fillStyle = '#25f4ee';
  ctx.fillRect(ROAD_X - 4, -20, 4, H + 40);
  ctx.shadowColor = '#fe2c55'; ctx.fillStyle = '#fe2c55';
  ctx.fillRect(ROAD_X + ROAD_W, -20, 4, H + 40);
  ctx.shadowBlur = 0;
  // lane stripes
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  for (let l = 1; l < LANES; l++) for (let y = -80 + S.stripes; y < H; y += 80) ctx.fillRect(ROAD_X + LANE_W * l - 2, y, 4, 40);
  // speed lines while boosted
  if (S.fx.boost.until > S.now) {
    ctx.strokeStyle = 'rgba(252,211,77,.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) { const x = rand(0, W), y = rand(0, H); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rand(40, 120)); ctx.stroke(); }
  }

  // obstacles
  for (const o of S.obstacles) {
    const x = laneX(o.lane);
    if (o.kind === 'cone') {
      ctx.fillStyle = '#fb923c';
      ctx.beginPath(); ctx.moveTo(x, o.y); ctx.lineTo(x + 26, o.y + o.h); ctx.lineTo(x - 26, o.y + o.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 13, o.y + o.h * 0.55, 26, 7);
    } else {
      const w = LANE_W - 34;
      roundRect(x - w / 2, o.y, w, o.h, 8); ctx.fillStyle = '#f1f5f9'; ctx.fill();
      ctx.save(); ctx.clip(); ctx.fillStyle = '#fe2c55';
      for (let sx = -w; sx < w; sx += 28) { ctx.beginPath(); ctx.moveTo(x - w / 2 + sx, o.y + o.h); ctx.lineTo(x - w / 2 + sx + 14, o.y + o.h); ctx.lineTo(x - w / 2 + sx + 14 + o.h, o.y); ctx.lineTo(x - w / 2 + sx + o.h, o.y); ctx.fill(); }
      ctx.restore();
      if (o.by) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'center'; ctx.fillText('@' + o.by.slice(0, 14), x, o.y - 8); }
    }
  }

  // boss
  const b = S.boss;
  if (b) {
    const y = -120 + (BOSS_Y + 120) * easeOut(clamp(b.enter, 0, 1));
    ctx.save(); ctx.translate(b.x, y);
    ctx.shadowColor = '#f87171'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#1f0a10'; ctx.strokeStyle = '#f87171'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-90, -20); ctx.lineTo(-50, -60); ctx.lineTo(50, -60); ctx.lineTo(90, -20); ctx.lineTo(60, 40); ctx.lineTo(-60, 40); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#f87171';
    ctx.beginPath(); ctx.arc(-30, -15, 12, 0, Math.PI * 2); ctx.arc(30, -15, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'center'; ctx.fillText('LV ' + b.level, 0, 30);
    ctx.restore();
  }
  ctx.fillStyle = '#fca5a5'; ctx.shadowColor = '#f87171'; ctx.shadowBlur = 14;
  for (const s of S.shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill(); }
  ctx.shadowBlur = 0;

  // player car
  if (!(S.invuln > 0 && Math.floor(S.now * 14) % 2) || S.crashed > 0) drawCar(S.x, PLAYER_Y, S.crashed > 0);

  for (const p of S.particles) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  if (S.fx.slow.until > S.now) { ctx.fillStyle = 'rgba(56,189,248,.08)'; ctx.fillRect(0, 0, W, H); }
  if (S.fx.reverse.until > S.now) { ctx.strokeStyle = 'rgba(196,181,253,.5)'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, W - 10, H - 10); }
  ctx.restore();

  drawMud();
}

function drawCar(x, y, wrecked) {
  ctx.save(); ctx.translate(x, y);
  if (wrecked) ctx.rotate(Math.sin(S.now * 20) * 0.08);
  ctx.shadowColor = '#25f4ee'; ctx.shadowBlur = wrecked ? 0 : 24;
  roundRect(-CAR_W / 2, 0, CAR_W, CAR_H, 18); ctx.fillStyle = wrecked ? '#475569' : '#25f4ee'; ctx.fill();
  ctx.shadowBlur = 0;
  roundRect(-CAR_W / 2 + 10, 22, CAR_W - 20, 30, 8); ctx.fillStyle = '#0b1026'; ctx.fill();
  roundRect(-CAR_W / 2 + 12, 74, CAR_W - 24, 22, 6); ctx.fillStyle = 'rgba(11,16,38,.75)'; ctx.fill();
  ctx.fillStyle = '#fff7ae'; ctx.fillRect(-CAR_W / 2 + 6, 2, 14, 6); ctx.fillRect(CAR_W / 2 - 20, 2, 14, 6);
  ctx.fillStyle = '#fe2c55'; ctx.fillRect(-CAR_W / 2 + 6, CAR_H - 8, 14, 5); ctx.fillRect(CAR_W / 2 - 20, CAR_H - 8, 14, 5);
  ctx.restore();
}

function drawMud() {
  mctx.clearRect(0, 0, W, H);
  if (!S.mud.length) return;
  const left = S.fx.mud.until - S.now;
  mctx.globalAlpha = clamp(left, 0, 1) * 0.92;
  for (const m of S.mud) {
    mctx.fillStyle = '#5b3a1a';
    mctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 9) {
      const r = m.r * (0.75 + 0.25 * Math.sin(a * 3 + m.seed));
      mctx.lineTo(m.x + Math.cos(a) * r, m.y + Math.sin(a) * r);
    }
    mctx.fill();
    mctx.fillStyle = '#7c5427';
    mctx.beginPath(); mctx.arc(m.x - m.r * 0.25, m.y - m.r * 0.25, m.r * 0.3, 0, Math.PI * 2); mctx.fill();
  }
  mctx.globalAlpha = 1;
}
const easeOut = (t) => 1 - (1 - t) ** 3;

// ---------- HUD ----------
const $ = (id) => document.getElementById(id);
let hudKey = '';
function renderHud() {
  $('score').textContent = Math.floor(S.dist).toLocaleString();
  $('best').textContent = Math.max(S.best, Math.floor(S.dist)).toLocaleString();
  $('hptext').textContent = Math.ceil(S.hp);
  const fill = $('hpfill');
  fill.style.width = S.hp + '%';
  fill.style.background = S.hp > 50 ? 'linear-gradient(90deg,#22c55e,#a3e635)' : S.hp > 25 ? 'linear-gradient(90deg,#f59e0b,#fbbf24)' : 'linear-gradient(90deg,#dc2626,#f87171)';

  const list = [];
  const add = (key, until, extra = '') => { const s = until - S.now; if (s > 0) list.push({ key, s, extra }); };
  add('SPEED_BOOST', S.fx.boost.until, `×${S.fx.boost.mul.toFixed(1)}`);
  add('SPEED_SLOW', S.fx.slow.until, `×${S.fx.slow.mul.toFixed(1)}`);
  add('SCREEN_SPLATTER', S.fx.mud.until);
  add('REVERSE_CONTROLS', S.fx.reverse.until);
  if (S.boss && S.boss.until > S.now) add('BOSS_ATTACK', S.boss.until, `LV ${S.boss.level}`);
  const key = list.map((f) => f.key + f.extra + Math.ceil(f.s)).join('|');
  if (key === hudKey) return;
  hudKey = key;
  $('effects').innerHTML = list.map((f) => {
    const look = ACTION_LOOK[f.key];
    return `<div class="fx" style="color:${look.color}">${icon(look.icon)}<span>${look.label} ${f.extra}</span><b>${Math.ceil(f.s)}s</b></div>`;
  }).join('');
}

function showAlert(ev, handled) {
  const look = ACTION_LOOK[ev.action] ?? { icon: 'circle-help', color: '#94a3b8', label: ev.action };
  const giftIcon = GIFT_ICON[String(ev.giftName).toLowerCase()] ?? (ev.giftId === 'test' && !ev.matchedRule ? 'flask-conical' : 'gift');
  const el = document.createElement('div');
  el.className = 'alert';
  el.style.borderLeftColor = look.color;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const what = ev.giftId === 'test' && !ev.matchedRule ? 'test trigger' : `${esc(ev.giftName)}${ev.repeatCount > 1 ? ' ×' + ev.repeatCount : ''}`;
  const pic = ev.giftImage ? `<img src="${esc(imgSrc(ev.giftImage))}" alt="" style="width:1.7em;height:1.7em;object-fit:contain">` : icon(giftIcon);
  el.innerHTML = `<div class="ic" style="color:${look.color}">${pic}</div>
    <div style="min-width:0"><div class="who">@${esc(ev.user)}</div>
    <div class="what">${what} <span style="color:${look.color};display:inline-flex;align-items:center;gap:.25em">${icon('arrow-right')} ${icon(look.icon)} ${esc(look.label)}${handled ? '' : ' (unknown)'}</span></div></div>`;
  const box = $('alerts');
  box.prepend(el);
  while (box.children.length > 5) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 4200);
}

let bannerTimer;
function banner(title, sub, color = '#fff') {
  const b = $('banner');
  clearTimeout(bannerTimer);
  if (!title) { b.innerHTML = ''; return; }
  b.innerHTML = `<h2 style="color:${color}">${title}</h2><p>${sub.replace(/[<>&]/g, '')}</p>`;
  b.classList.remove('flashbanner'); void b.offsetWidth; b.classList.add('flashbanner');
  bannerTimer = setTimeout(() => (b.innerHTML = ''), 2600);
}

// ---------- input ----------
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { S.autopilot = false; syncAutoBtn(); steer(-1); }
  if (e.key === 'ArrowRight' || e.key === 'd') { S.autopilot = false; syncAutoBtn(); steer(1); }
  if (e.key === 'p') { S.autopilot = !S.autopilot; syncAutoBtn(); }
});
cvs.parentElement.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.tools')) return;
  const r = cvs.getBoundingClientRect();
  S.autopilot = false; syncAutoBtn();
  steer(e.clientX - r.left < r.width / 2 ? -1 : 1);
});
const autoBtn = $('autoBtn');
function syncAutoBtn() { autoBtn.lastElementChild.textContent = S.autopilot ? 'Autopilot on' : 'Autopilot off'; }
autoBtn.addEventListener('click', (e) => { e.stopPropagation(); S.autopilot = !S.autopilot; syncAutoBtn(); });

// ---------- WebSocket ----------
let ws, retry = 0;
function connect() {
  const sep = SERVER.includes('?') ? '&' : '?';
  const url = `${SERVER}${sep}role=game${TOKEN ? '&token=' + encodeURIComponent(TOKEN) : ''}`;
  const setConn = (on, text) => { $('dot').classList.toggle('on', on); $('connText').textContent = text; };
  try { ws = new WebSocket(url); } catch { setConn(false, 'bad server address'); return; }
  ws.onopen = () => { retry = 0; setConn(true, 'live · waiting for gifts'); };
  ws.onmessage = (m) => {
    let msg; try { msg = JSON.parse(m.data); } catch { return; }
    if (msg.type === 'GAME_EVENT' && msg.payload) handleGameEvent(msg.payload);
  };
  ws.onclose = (e) => {
    if (e.code === 4401) { setConn(false, 'access token missing: add ?token=… to the URL'); return; }
    setConn(false, 'server offline, retrying…');
    setTimeout(connect, Math.min(10000, 700 * 2 ** retry++));
  };
}
connect();
requestAnimationFrame(tick);
</script>
