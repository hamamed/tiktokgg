# Publishes web-dashboard/ (the single-file control panel) to GitHub Pages.
# Custom domain: tiktokgg.koydam.com. Set it once under Settings → Pages → Custom domain
# and add a DNS record:  CNAME  tiktokgg  →  <your-github-user>.github.io
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web-dashboard/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
